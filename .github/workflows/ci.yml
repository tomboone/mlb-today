name: ci

on:
  pull_request:
  push:
    branches: ["release/v2", "main"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Keep `uv run` from re-locking; every step uses uv.lock as committed.
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only; publishing to GHCR is image.yml's job (spec §11).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mlb-today:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
