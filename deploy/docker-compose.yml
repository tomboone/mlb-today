name: mlb-today

services:
  mlb-today:
    # `latest` tracks main; pin `sha-<7>` to roll back (README).
    image: ghcr.io/tomboone/mlb-today:latest
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=mlb-today

  # Polls GHCR every 5 minutes and restarts only containers carrying the enable label in its scope, so
  # it leaves other projects' containers and Watchtowers on the host, such as nba-today's, alone. The
  # instance carries its own scope label, as Watchtower's multiple-instance docs require.
  watchtower:
    image: nickfedor/watchtower:1.23.2
    command: ["--label-enable", "--scope", "mlb-today", "--interval", "300", "--cleanup"]
    labels:
      - com.centurylinklabs.watchtower.scope=mlb-today
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
